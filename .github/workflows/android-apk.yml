name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          accept-android-sdk-licenses: true
          packages: "platform-tools"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK path is not configured."
            exit 1
          fi
          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      - name: Set up Godot and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android export paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Validate project scene
        run: godot --headless --path . --quit-after 5

      - name: Export Android debug APK
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/STICKMAN-SHADOW-WORLD-debug.apk

      - name: Verify APK exists
        run: |
          set -euo pipefail
          test -s build/STICKMAN-SHADOW-WORLD-debug.apk
          file build/STICKMAN-SHADOW-WORLD-debug.apk
          ls -lh build/STICKMAN-SHADOW-WORLD-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: STICKMAN-SHADOW-WORLD-Android-debug
          path: build/STICKMAN-SHADOW-WORLD-debug.apk
          if-no-files-found: error
          retention-days: 14
